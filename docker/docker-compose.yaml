# docker-compose
services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: NYC_Taxi
    ports:
      - "9092:9092"

    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_kraft:/var/lib/kafka/data # providing named volume we created to the docker container
    networks:
      - lakehouse-net # put all service containers into one private virtual web

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ..:/app # <path_on_host>:<path_on_docker>
    networks:
      - lakehouse-net # put all service containers into one private virtual web

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master # ensures spark-master container will be build before spark-worker
    volumes:
      - ..:/app # <path_on_host>:<path_on_docker>
    networks:
      - lakehouse-net # put all service containers into one private virtual web

volumes:
  kafka_kraft: #creation of 'named volume' for Kafka container instead of bind mount (docker will have permament storage which he will manage on its own)

networks:
  lakehouse-net:
    driver: bridge

